<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente per il corpo principale dell'icona -->
    <linearGradient id="bodyGrad" x1="0" y1="12" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B5B5B" />
      <stop offset="100%" stop-color="#1A1A1A" />
    </linearGradient>

    <!-- Gradiente per la barra bianca del ciak -->
    <linearGradient id="stripeGrad" x1="0" y1="4" x2="0" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDFDFD" />
      <stop offset="100%" stop-color="#CDCDCD" />
    </linearGradient>

    <!-- Ombra per il tasto Play -->
    <filter id="playShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Clip Path per mantenere i bordi arrotondati dell'icona (radius ridotto a 8) -->
    <clipPath id="iconClip">
      <rect x="4" y="4" width="56" height="56" rx="8" />
    </clipPath>
  </defs>

  <!-- Corpo principale mascherato -->
  <g clip-path="url(#iconClip)">
    
    <!-- Sfondo principale -->
    <rect x="4" y="4" width="56" height="56" fill="url(#bodyGrad)" />

    <!-- Striscia superiore del ciak (Base bianca, resa più stretta) -->
    <rect x="4" y="4" width="56" height="8" fill="url(#stripeGrad)" />

    <!-- Strisce diagonali nere (adattate alla nuova altezza) -->
    <g fill="#181818">
      <path d="M 12 4 L 20 4 L 26 12 L 18 12 Z" />
      <path d="M 28 4 L 36 4 L 42 12 L 34 12 Z" />
      <path d="M 44 4 L 52 4 L 58 12 L 50 12 Z" />
    </g>

    <!-- Linea di separazione tra il ciak e il corpo -->
    <rect x="4" y="12" width="56" height="1" fill="#0A0A0A" opacity="0.6"/>
    <rect x="4" y="13" width="56" height="1" fill="#FFFFFF" opacity="0.1"/>
  </g>

  <!-- Riflesso interno morbido (Inner Glow) adattato al nuovo radius -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="7.5" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15" />
  
  <!-- Tasto Play (Rimpicciolito e riposizionato) -->
  <path d="M 28.5 27 L 40.5 34 L 28.5 41 Z" 
        fill="#FFFFFF" 
        stroke="#FFFFFF" 
        stroke-width="2.5" 
        stroke-linejoin="round" 
        filter="url(#playShadow)" />
</svg>
