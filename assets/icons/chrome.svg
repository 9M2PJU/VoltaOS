<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="1.886 1.886 60.227 60.227" fill="none">
  <defs>
    
    <filter id="buttonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A4A4A" />
      <stop offset="100%" stop-color="#1A1A1A" />
    </linearGradient>

    
    <clipPath id="baseClip">
      <rect x="6" y="6" width="52" height="52" rx="8" />
    </clipPath>
  </defs>

  
  <rect x="6" y="6" width="52" height="52" rx="8" fill="url(#baseGrad)" filter="url(#buttonShadow)" stroke="#555555" stroke-width="1" />

  
  <rect x="6" y="6" width="52" height="15" fill="#A6A6A6" clip-path="url(#baseClip)" />

  
  <line x1="6" y1="21" x2="58" y2="21" stroke="#222222" stroke-width="1.5" />

  
  <rect x="7" y="7" width="50" height="50" rx="7" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.25" />

  
  <rect x="15" y="30" width="34" height="7" rx="3.5" fill="#FFFFFF" filter="url(#elementShadow)" />

  
  <circle cx="20" cy="43" r="3.2" fill="#A83232" filter="url(#elementShadow)" />
  <circle cx="28" cy="43" r="3.2" fill="#D8D8D8" filter="url(#elementShadow)" />
  <circle cx="36" cy="43" r="3.2" fill="#C29B27" filter="url(#elementShadow)" />
  <circle cx="44" cy="43" r="3.2" fill="#3A538C" filter="url(#elementShadow)" />
</svg>