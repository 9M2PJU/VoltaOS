      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="50%" stop-color="#D61818" />
      <stop offset="100%" stop-color="#6E0000" />
    </radialGradient>

    
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6A6A6A" />
