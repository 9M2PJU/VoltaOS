  <rect x="14" y="44" width="36" height="12" rx="3.5" fill="url(#baseGrad)" filter="url(#dropShadow)" />

  
  <rect x="15" y="44.5" width="34" height="1" rx="0.5" fill="#888888" opacity="0.6" />

  
  <rect x="39" y="42" width="6" height="3" rx="1.5" fill="#C91A1A" />

  
