<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="1.886 1.886 60.227 60.227" fill="none">
  <defs>
    
    <filter id="buttonShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    
    <linearGradient id="calBgGrad" x1="32" y1="6" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D0D0D0" />
    </linearGradient>

    
    <linearGradient id="redHeaderGrad" x1="32" y1="6" x2="32" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#C62828" />
    </linearGradient>

    
    <clipPath id="baseClip">
      <rect x="6" y="6" width="52" height="52" rx="5" />
    </clipPath>
  </defs>

  
  <rect x="6" y="6" width="52" height="52" rx="5" fill="url(#calBgGrad)" filter="url(#buttonShadow)" stroke="#A0A0A0" stroke-width="1" />

  
  <rect x="6" y="6" width="52" height="10" fill="url(#redHeaderGrad)" clip-path="url(#baseClip)" />

  
  <line x1="6" y1="16" x2="58" y2="16" stroke="#9C1C1C" stroke-width="1.5" />
</svg>